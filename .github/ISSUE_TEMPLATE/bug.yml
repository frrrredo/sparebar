name: Bug
description: Something is not working.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include what you expected instead. Keep account data and credentials private.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Sparebar, macOS, and affected CLI version.
    validations:
      required: true
