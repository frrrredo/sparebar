name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macOS:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with synthetic fixtures
        run: swift test
      - name: Test release validation
        run: python3 -B scripts/test-release.py
      - name: Build and verify local app bundle
        run: ./scripts/package-app.sh
      - name: Archive the exact main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/release.py archive dist/Sparebar.app dist/artifact
      - name: Retain the verified release input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sparebar-macos-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/artifact/
          if-no-files-found: error
          retention-days: 30
